<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="avatarGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#06080e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="#0b101d"/>
  <circle cx="100" cy="100" r="90" fill="url(#avatarGlow)"/>
  <circle cx="100" cy="100" r="96" stroke="url(#cyberBorder)" stroke-width="3" stroke-dasharray="6 4"/>
  
  <!-- Stylized avatar silhouette / developer avatar -->
  <circle cx="100" cy="75" r="32" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  <path d="M48 160C48 128 72 118 100 118C128 118 152 128 152 160" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Cyber visor / glasses -->
  <rect x="80" y="66" width="40" height="12" rx="4" fill="#06b6d4" fill-opacity="0.8"/>
  <line x1="82" y1="72" x2="118" y2="72" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Terminal node dots -->
  <circle cx="100" cy="140" r="3" fill="#22d3ee"/>
  <circle cx="85" cy="150" r="2" fill="#8b5cf6"/>
  <circle cx="115" cy="150" r="2" fill="#8b5cf6"/>
</svg>
